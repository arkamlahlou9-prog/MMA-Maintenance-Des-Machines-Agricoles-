<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أكاديمية صيانة الجرارات 🚜</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f6f8;
    color:#17202a;
}
header{
    background:#182a3a;
    color:white;
    padding:30px 20px;
    text-align:center;
}
header h1{margin:0 0 10px;font-size:30px}
header p{margin:0;color:#dbe4ea}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.progress-box{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 3px 12px #0001;
}
.progress{
    height:15px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}
.progress-bar{
    height:100%;
    width:0%;
    background:#2e7d32;
    transition:.3s;
}

.search{
    width:100%;
    padding:14px;
    border:1px solid #ccd3d8;
    border-radius:10px;
    font-size:16px;
    margin-bottom:20px;
}

.stage{
    margin-bottom:25px;
}
.stage-title{
    background:#263b4d;
    color:white;
    padding:15px;
    border-radius:12px;
    font-size:20px;
}

.lessons{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:12px;
    margin-top:12px;
}

.lesson{
    background:white;
    border-radius:12px;
    padding:16px;
    cursor:pointer;
    border:2px solid transparent;
    box-shadow:0 2px 8px #0001;
    transition:.2s;
}
.lesson:hover{
    transform:translateY(-2px);
    border-color:#78909c;
}
.lesson.done{
    border-color:#2e7d32;
}
.lesson-number{
    font-size:13px;
    color:#607d8b;
}
.lesson h3{
    margin:8px 0;
    font-size:17px;
}
.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:20px;
    background:#e8f5e9;
    color:#256029;
    font-size:12px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0009;
    z-index:10;
    padding:20px;
    overflow:auto;
}
.modal-content{
    background:white;
    max-width:800px;
    margin:30px auto;
    padding:25px;
    border-radius:18px;
}
.close{
    float:left;
    font-size:25px;
    cursor:pointer;
}
.lesson-body{
    line-height:1.9;
}
.lesson-body h3{
    color:#263b4d;
}
.tip{
    background:#fff8e1;
    padding:15px;
    border-right:5px solid #f9a825;
    border-radius:8px;
    margin:15px 0;
}
button{
    border:0;
    padding:12px 18px;
    border-radius:9px;
    cursor:pointer;
    font-size:15px;
}
.complete{
    background:#2e7d32;
    color:white;
}
.reset{
    background:#607d8b;
    color:white;
    margin-top:15px;
}
footer{
    text-align:center;
    padding:30px;
    color:#607d8b;
}
</style>
</head>

<body>

<header>
    <h1>🚜 أكاديمية صيانة الجرارات</h1>
    <p>من أساسيات الجرار إلى تشخيص الأعطال</p>
</header>

<div class="container">

<div class="progress-box">
    <strong>تقدمك في التكوين: <span id="percent">0%</span></strong>
    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <p><span id="completed">0</span> من 50 درس مكتمل</p>
</div>

<input
    class="search"
    id="search"
    placeholder="🔎 ابحث عن درس: محرك، هيدروليك، كهرباء..."
>

<div id="course"></div>

</div>

<div class="modal" id="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">×</span>
<div id="modalContent"></div>
</div>
</div>

<footer>
    🚜 تعلم — طبّق — شخّص — طوّر مهاراتك
</footer>

<script>

const lessons = [

["المرحلة 1 — أساسيات الجرار", [
"مكونات الجرار ووظيفة كل نظام",
"كيفاش تفكر كتقني وتشخّص العطل",
"أنواع الجرارات ومحركات الديزل",
"أدوات ومعدات الصيانة واستعمالها بأمان",
"السلامة داخل الورشة ومع الجرار"
]],

["المرحلة 2 — محرك الديزل", [
"مكونات المحرك بالتفصيل",
"الأشواط الأربعة لمحرك الديزل",
"نظام الهواء وفلتر الهواء",
"نظام الوقود من الخزان إلى الحاقن",
"مضخة الحقن والحاقنات",
"نظام التزييت والزيت والفلتر",
"نظام التبريد والرادياتور",
"نظام العادم والشاحن التوربيني Turbo",
"أعراض أعطال المحرك وكيفية تشخيصها"
]],

["المرحلة 3 — الكهرباء", [
"أساسيات الكهرباء في الجرار",
"البطارية وكيفية فحصها",
"السلف Démarreur",
"الدينامو Alternateur وشحن البطارية",
"الفيوزات والمرحلات Relais",
"الحساسات والعدادات",
"قراءة المخططات الكهربائية",
"تشخيص الأعطال الكهربائية"
]],

["المرحلة 4 — نقل الحركة", [
"القابض Embrayage",
"علبة السرعات Boîte de vitesses",
"عمود نقل الحركة",
"Differential — الدفرنس",
"المحاور والعجلات",
"أعطال نظام نقل الحركة"
]],

["المرحلة 5 — الهيدروليك", [
"كيف يعمل النظام الهيدروليكي",
"الزيت والفلتر",
"المضخة الهيدروليكية",
"الصمامات",
"الأسطوانات الهيدروليكية",
"الرفع الهيدروليكي",
"تشخيص التسرب وضعف الرفع",
"أعطال الهيدروليك"
]],

["المرحلة 6 — أنظمة الجرار", [
"نظام التوجيه Direction",
"نظام الفرامل",
"PTO — مأخذ القدرة",
"نظام التعليق والربط ثلاثي النقاط",
"الجرارات ذات الدفع الرباعي 4×4",
"أنظمة التحكم الإلكترونية الحديثة"
]],

["المرحلة 7 — الصيانة والتشخيص", [
"الصيانة الوقائية",
"الصيانة الإصلاحية",
"كيف تعمل خطة تشخيص",
"استعمال أجهزة القياس",
"تشخيص الأعطال حسب الأعراض",
"كيف تكتب تقرير الصيانة",
"كيف تتعامل مع الزبون",
"كيف تصبح Technicien Maintenance محترف"
]]

];

let allLessons = [];
let number = 1;

lessons.forEach(stage => {
    stage[1].forEach(title => {
        allLessons.push({
            id:number,
            stage:stage[0],
            title:title
        });
        number++;
    });
});

const explanations = {

"مكونات الجرار ووظيفة كل نظام":
`
<h3>🎯 الهدف</h3>
<p>فهم الأنظمة الرئيسية التي يتكون منها الجرار.</p>
<ul>
<li>المحرك: يولد القدرة.</li>
<li>الوقود: يزود المحرك بالوقود.</li>
<li>التبريد: يتحكم في الحرارة.</li>
<li>التزييت: يقلل الاحتكاك.</li>
<li>نقل الحركة: ينقل القدرة إلى العجلات.</li>
<li>الهيدروليك: يشغل معدات مختلفة.</li>
<li>الكهرباء: التشغيل والإنارة والحساسات.</li>
</ul>
`,

"كيفاش تفكر كتقني وتشخّص العطل":
`
<h3>🧠 منهج التشخيص</h3>
<p>لا تبدل القطعة مباشرة.</p>
<p><b>العرض → الفحص → تحديد السبب → الإصلاح → الاختبار</b></p>
<div class="tip">التقني الجيد يبحث عن الدليل قبل تغيير القطعة.</div>
`,

"أنواع الجرارات ومحركات الديزل":
`
<h3>🚜 أنواع الجرارات</h3>
<p>توجد جرارات مختلفة حسب القوة، الاستعمال، ونظام الدفع.</p>
<h3>محرك الديزل</h3>
<p>يستعمل الديزل في عدد كبير من الجرارات بسبب ملاءمته للأعمال الثقيلة.</p>
`,

"أدوات ومعدات الصيانة واستعمالها بأمان":
`
<h3>🔧 الأدوات</h3>
<ul>
<li>مفاتيح الربط.</li>
<li>مفكات.</li>
<li>مفتاح عزم Torque wrench.</li>
<li>جهاز قياس كهربائي Multimeter.</li>
<li>معدات التنظيف والتشحيم.</li>
</ul>
<div class="tip">استعمل الأداة المناسبة للمهمة ولا تستعمل أداة تالفة.</div>
`,

"السلامة داخل الورشة ومع الجرار":
`
<h3>🦺 السلامة</h3>
<ul>
<li>أوقف الجرار قبل أعمال الصيانة.</li>
<li>ثبت الجرار على سطح مناسب.</li>
<li>استعمل معدات الحماية الشخصية.</li>
<li>ابتعد عن الأجزاء المتحركة.</li>
<li>لا تعمل على نظام ساخن أو مضغوط دون اتخاذ إجراءات السلامة المناسبة.</li>
</ul>
`,

"مكونات المحرك بالتفصيل":
`
<h3>⚙️ أهم أجزاء المحرك</h3>
<p>كتلة المحرك، المكابس، أذرع التوصيل، عمود المرفق، رأس المحرك، الصمامات، ونظام الحقن.</p>
`,

"الأشواط الأربعة لمحرك الديزل":
`
<h3>🔄 دورة المحرك</h3>
<ol>
<li>Admission — دخول الهواء.</li>
<li>Compression — ضغط الهواء.</li>
<li>Combustion/Power — الاحتراق وتوليد القدرة.</li>
<li>Exhaust — إخراج الغازات.</li>
</ol>
`,

"نظام الهواء وفلتر الهواء":
`
<h3>🌬️ الهواء</h3>
<p>يحتاج محرك الديزل إلى كمية مناسبة من الهواء.</p>
<p>فلتر الهواء يمنع دخول الأوساخ إلى المحرك.</p>
`,

"نظام الوقود من الخزان إلى الحاقن":
`
<h3>⛽ مسار الوقود</h3>
<p>الخزان → الفلتر → مضخة الوقود → نظام الحقن → الحاقن.</p>
<div class="tip">أي انسداد أو دخول هواء في النظام قد يؤدي إلى مشاكل في التشغيل حسب تصميم الجرار.</div>
`,

"مضخة الحقن والحاقنات":
`
<h3>⛽ الحقن</h3>
<p>وظيفة نظام الحقن إيصال الوقود إلى المحرك بالكمية والتوقيت المناسبين حسب تصميم النظام.</p>
`,

"نظام التزييت والزيت والفلتر":
`
<h3>🛢️ التزييت</h3>
<p>الزيت يقلل الاحتكاك ويساعد على تبريد وتنظيف أجزاء المحرك.</p>
<p>يجب استعمال الزيت بالمواصفات التي يحددها مصنع الجرار.</p>
`,

"نظام التبريد والرادياتور":
`
<h3>🌡️ التبريد</h3>
<p>يحافظ نظام التبريد على درجة تشغيل مناسبة للمحرك.</p>
<p>يشمل حسب التصميم: سائل التبريد، المضخة، الثرموستات، الرادياتور والمروحة.</p>
<div class="tip">لا تفتح نظام التبريد المضغوط والمحرك ساخن.</div>
`,

"نظام العادم والشاحن التوربيني Turbo":
`
<h3>💨 العادم والتوربو</h3>
<p>نظام العادم يخرج غازات الاحتراق.</p>
<p>الشاحن التوربيني يستخدم طاقة غازات العادم لزيادة كمية الهواء الداخلة للمحرك في الأنظمة المزودة به.</p>
`,

"أعراض أعطال المحرك وكيفية تشخيصها":
`
<h3>🔍 التشخيص</h3>
<p>من الأعراض الشائعة: صعوبة التشغيل، ضعف الأداء، ارتفاع الحرارة أو أصوات غير طبيعية.</p>
<p>ابدأ دائمًا من الأساسيات ثم انتقل إلى الفحوص الأكثر تخصصًا.</p>
`,

"أساسيات الكهرباء في الجرار":
`
<h3>⚡ أساسيات</h3>
<p>تعلم الفرق بين الجهد، التيار، المقاومة، الدائرة الكهربائية والتوصيلات.</p>
`,

"البطارية وكيفية فحصها":
`
<h3>🔋 البطارية</h3>
<p>البطارية توفر الطاقة اللازمة لبدء التشغيل وتغذية الدوائر الكهربائية عند الحاجة.</p>
<p>يمكن فحص الجهد بأداة قياس مناسبة وفق إجراءات السلامة.</p>
`,

"السلف Démarreur":
`
<h3>🔄 السلف</h3>
<p>السلف يحول الطاقة الكهربائية إلى حركة ميكانيكية لتدوير المحرك عند بدء التشغيل.</p>
`,

"الدينامو Alternateur وشحن البطارية":
`
<h3>⚡ Alternateur</h3>
<p>يقوم بتوليد الطاقة الكهربائية أثناء عمل المحرك ويساعد على شحن البطارية حسب النظام.</p>
`,

"الفيوزات والمرحلات Relais":
`
<h3>🧩 الحماية والتحكم</h3>
<p>الفيوز يحمي الدائرة من تيار زائد.</p>
<p>الـRelais يسمح بالتحكم في دوائر كهربائية بطريقة مناسبة لتصميم النظام.</p>
`,

"الحساسات والعدادات":
`
<h3>📊 الحساسات</h3>
<p>الحساسات ترسل معلومات إلى العدادات أو وحدة التحكم، مثل الحرارة والضغط والسرعة حسب نوع الجرار.</p>
`,

"قراءة المخططات الكهربائية":
`
<h3>📐 المخططات</h3>
<p>تعلم الرموز، مصادر الطاقة، نقاط الأرضي، الفيوزات، المفاتيح والأسلاك.</p>
`,

"تشخيص الأعطال الكهربائية":
`
<h3>🔎 التشخيص الكهربائي</h3>
<p>ابدأ بمصدر الطاقة ثم الفيوزات والتوصيلات والمسار الكهربائي، واستعمل القياسات بدل التخمين.</p>
`,

"القابض Embrayage":
`
<h3>⚙️ القابض</h3>
<p>يفصل أو يوصل قدرة المحرك مع نظام نقل الحركة، مما يسمح بتغيير السرعات وتشغيل النظام بطريقة مناسبة.</p>
`,

"علبة السرعات Boîte de vitesses":
`
<h3>⚙️ علبة السرعات</h3>
<p>تغير نسبة السرعة والعزم المنقولين إلى نظام الحركة.</p>
`,

"عمود نقل الحركة":
`
<h3>🔩 نقل القدرة</h3>
<p>ينقل العزم بين أجزاء نظام نقل الحركة حسب تصميم الجرار.</p>
`,

"Differential — الدفرنس":
`
<h3>⚙️ Differential</h3>
<p>يسمح للعجلتين على المحور نفسه بالدوران بسرعات مختلفة عند المنعطفات.</p>
`,

"المحاور والعجلات":
`
<h3>🚜 المحاور</h3>
<p>تنقل الأحمال والقوة إلى العجلات وتساهم في ثبات الجرار وحركته.</p>
`,

"أعطال نظام نقل الحركة":
`
<h3>🔍 أعطال محتملة</h3>
<p>الأعراض قد تشمل صعوبة تغيير السرعات، أصوات غير طبيعية أو ضعف نقل القدرة.</p>
`,

"كيف يعمل النظام الهيدروليكي":
`
<h3>💧 الهيدروليك</h3>
<p>يستخدم الزيت المضغوط لنقل الطاقة وتشغيل مكونات مثل الأسطوانات والرفع.</p>
`,

"الزيت والفلتر":
`
<h3>💧 زيت الهيدروليك</h3>
<p>الزيت المناسب والنظيف ضروريان لأداء النظام وحماية مكوناته.</p>
`,

"المضخة الهيدروليكية":
`
<h3>🔵 المضخة</h3>
<p>تولد تدفق الزيت اللازم لتشغيل النظام الهيدروليكي.</p>
`,

"الصمامات":
`
<h3>🔧 الصمامات</h3>
<p>تتحكم في اتجاه وتدفق وضغط الزيت حسب نوع النظام.</p>
`,

"الأسطوانات الهيدروليكية":
`
<h3>💧 الأسطوانة</h3>
<p>تحول ضغط الزيت إلى حركة خطية تستخدم في الرفع أو تحريك المعدات.</p>
`,

"الرفع الهيدروليكي":
`
<h3>⬆️ الرفع</h3>
<p>يسمح برفع وخفض معدات مرتبطة بالجرار حسب تصميم نظام الربط.</p>
`,

"تشخيص التسرب وضعف الرفع":
`
<h3>🔍 التشخيص</h3>
<p>افحص مستوى الزيت، التسربات الظاهرة، حالة الفلتر، واستجابة النظام وفق دليل الصيانة.</p>
`,

"أعطال الهيدروليك":
`
<h3>⚠️ أمثلة</h3>
<p>ضعف الرفع، بطء الحركة، أصوات غير طبيعية أو تسرب الزيت قد تشير إلى أسباب مختلفة تحتاج إلى تشخيص.</p>
`,

"نظام التوجيه Direction":
`
<h3>🛞 التوجيه</h3>
<p>يسمح للسائق بالتحكم في اتجاه الجرار.</p>
`,

"نظام الفرامل":
`
<h3>🛑 الفرامل</h3>
<p>وظيفتها التحكم في سرعة الجرار وإيقافه بأمان.</p>
<div class="tip">أي مشكلة في الفرامل تعتبر مسألة سلامة ويجب التعامل معها وفق تعليمات المصنع.</div>
`,

"PTO — مأخذ القدرة":
`
<h3>🔄 PTO</h3>
<p>ينقل القدرة من الجرار إلى بعض المعدات الزراعية المصممة للعمل معه.</p>
<div class="tip">الأجزاء الدوارة يمكن أن تكون خطرة جدًا. لا تقترب منها أثناء دورانها.</div>
`,

"نظام التعليق والربط ثلاثي النقاط":
`
<h3>🔗 Three Point Hitch</h3>
<p>يستخدم لربط ورفع معدات زراعية خلف الجرار.</p>
`,

"الجرارات ذات الدفع الرباعي 4×4":
`
<h3>🚜 4×4</h3>
<p>ينقل نظام الدفع القدرة إلى المحاور المناسبة لتحسين الجر في ظروف مختلفة حسب تصميم الجرار.</p>
`,

"أنظمة التحكم الإلكترونية الحديثة":

function renderCourse(filter=""){

    const course = document.getElementById("course");
    course.innerHTML="";

    lessons.forEach(stage => {

        const filtered = stage[1].filter(title =>
            title.toLowerCase().includes(filter.toLowerCase())
        );

        if(filtered.length===0) return;

        const section=document.createElement("section");
        section.className="stage";

        section.innerHTML=`<div class="stage-title">${stage[0]}</div>`;

        const grid=document.createElement("div");
        grid.className="lessons";

        filtered.forEach(title=>{

            const lesson=allLessons.find(x=>x.title===title);

            const card=document.createElement("div");
            card.className="lesson";
            card.dataset.id=lesson.id;

            if(localStorage.getItem("lesson_"+lesson.id)==="done"){
                card.classList.add("done");
            }

            card.innerHTML=`
                <span class="lesson-number">الدرس ${lesson.id}</span>
                <h3>${title}</h3>
                <span class="badge">
                    ${localStorage.getItem("lesson_"+lesson.id)==="done"
                    ?"✓ مكتمل":"ابدأ الدرس"}
                </span>
            `;

            card.onclick=()=>openLesson(lesson);

            grid.appendChild(card);
        });

        section.appendChild(grid);
        course.appendChild(section);
    });
}

function openLesson(lesson){

    const text=explanations[lesson.title] ||
    `<p>هذا الدرس مخصص لـ: <b>${lesson.title}</b></p>
     <p>ادرس هذا الموضوع من دليل الجرار الخاص بالموديل الذي تتدرب عليه، ثم طبّق تحت إشراف شخص مؤهل.</p>`;

    document.getElementById("modalContent").innerHTML=`
        <h2>الدرس ${lesson.id}: ${lesson.title}</h2>
        <div class="lesson-body">${text}</div>
        <br>
        <button class="complete" onclick="completeLesson(${lesson.id})">
            ✓ وضع الدرس كمكتمل
        </button>
    `;

    document.getElementById("modal").style.display="block";
}

function closeModal(){
    document.getElementById("modal").style.display="none";
}

function completeLesson(id){
    localStorage.setItem("lesson_"+id,"done");
    updateProgress();
    renderCourse(document.getElementById("search").value);
    closeModal();
}

function updateProgress(){

    let completed=0;

    for(let i=1;i<=50;i++){
        if(localStorage.getItem("lesson_"+i)==="done"){
            completed++;
        }
    }

    const percent=Math.round((completed/50)*100);

    document.getElementById("completed").textContent=completed;
    document.getElementById("percent").textContent=percent+"%";
    document.getElementById("progressBar").style.width=percent+"%";
}

document.getElementById("search").addEventListener("input",function(){
    renderCourse(this.value);
});

window.onclick=function(e){
    if(e.target===document.getElementById("modal")){
        closeModal();
    }
};

renderCourse();
updateProgress();

</script>
